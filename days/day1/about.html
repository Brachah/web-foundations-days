
 <!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">index</a>
        <a href="about.html">about</a>
      </nav>
      <h1>QuickNotes</h1>
      <p>Capture ideas before they disappear.</p>
    </header>
 
    <main>
      <section>
        <h2>Send feedback</h2>
        <form id="feedback-form">
          <label for="note-input">New note</label>
          <input type="text" id="name" placeholder="Type your name..." />
          <input type="email" id="email" placeholder="Type email..." />
          <label for="feedback">Your Feedback:</label>
            <textarea id="feedback" name="feedback" rows="4" cols="50">
              Type your feedback
            </textarea>
          <button type="submit">Add Note</button>
        </form>
      </section>
 
      <section>
        <h2>Features</h2>
        <p id="note-count">Steps.</p>
        <ul id="notes-list">
          <li>Open HTML forms</li>
          <li>Revise HTML forms</li>
          <li>Push my code to GitHub</li>
        </ul>
      </section>
      <section>
        <h2>How to use QuickNotes</h2>
        <p id="note-count">Steps.</p>
        <ol id="notes-list">

          <li>Revise HTML forms</li>

        </ol>
      </section>
    </main>
